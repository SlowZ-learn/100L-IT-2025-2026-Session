<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css" />
    <title>student task and productivity dashboard</title>
  </head>

  <body>
    <header class="banner-img">
      <img src="img/3840x1512_home_gruvbox_7.png" alt="chill banner" srcset="">
    </header>

    <div class="main-container">
      <div class="clock-greeting">

      </div>

      <div class="header-section">
        <div class="task-container">
          <form id="task-form" class="task-form">
            <input type="textarea" id="task-input" placeholder="Enter a task" />

            <label for>Difficulty</label>
            <input type="range" id="difficulty" min="0" max="2" value="0" />
            <span id="difficulty-output"></span>

            <button type="button" id="addTask">Add Task</button>
            <button type="button" id="removeTask">Remove last Task</button>
            <select id="category">
              <option value="Programming">Programming</option>
              <option value="school"></option>
          <option value="`    "></option>
            </select>
          </form>
        </div>

        <div class="progress-container">
          <h2>Progress</h2>
          <div class="progression-numbers">
            <label for="">Total: </label><span id="progression-total"></span>
            <label for="">Complete: </label
            ><span id="progression-complete"></span>
            <label for="">Remaining: </label
            ><span id="progression-remaining"></span>
          </div>
        </div>
      </div>
      
      <div class = "task-list-container">
        <ul id="task-list"></ul></div>
    </div>
  </body>
</html>
